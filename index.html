<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161C18">
<title>Pizarra PF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --surface-2:#E5E8E2; --ink:#141A16; --ink-2:#4F5A52; --ink-3:#7D877F; --line:#D4D9D1;
  --accent:#D9501A; --accent-soft:#FBE3D8; --accent-ink:#FFFFFF;
  --gym:#3456C4; --gym-soft:#E0E6FA; --cancha:#2B7F48; --cancha-soft:#DCEFE2;
  --good:#2B7F48; --warn:#B87A06; --bad:#C0352B; --good-soft:#DCEFE2; --warn-soft:#F8EBCB; --bad-soft:#F7DDDA;
  --side:#161C18; --side-ink:#E6EBE4; --side-ink-2:#8F9A92; --side-hover:#222A25; --side-line:#2A322D;
  --shadow:0 12px 40px rgba(20,26,22,.18);
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1411; --surface:#161C18; --surface-2:#1E2621; --ink:#E6EBE4; --ink-2:#A3AEA6; --ink-3:#737E76; --line:#2A332D;
    --accent:#F0692F; --accent-soft:#3A2218; --accent-ink:#140A05;
    --gym:#7D97F2; --gym-soft:#1D2544; --cancha:#58BE7B; --cancha-soft:#16301F;
    --good:#58BE7B; --warn:#E0A62E; --bad:#EE6E62; --good-soft:#16301F; --warn-soft:#3A2D10; --bad-soft:#3B1A17;
    --side:#0A0D0B; --side-hover:#161C18; --side-line:#1E2621;
    --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1411; --surface:#161C18; --surface-2:#1E2621; --ink:#E6EBE4; --ink-2:#A3AEA6; --ink-3:#737E76; --line:#2A332D;
  --accent:#F0692F; --accent-soft:#3A2218; --accent-ink:#140A05;
  --gym:#7D97F2; --gym-soft:#1D2544; --cancha:#58BE7B; --cancha-soft:#16301F;
  --good:#58BE7B; --warn:#E0A62E; --bad:#EE6E62; --good-soft:#16301F; --warn-soft:#3A2D10; --bad-soft:#3B1A17;
  --side:#0A0D0B; --side-hover:#161C18; --side-line:#1E2621;
  --shadow:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100%}

/* ---------- sidebar ---------- */
.side{width:264px;flex:0 0 264px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;transition:margin-left .22s ease}
.app.side-off .side{margin-left:-264px}
.side-head{padding:18px 18px 14px;border-bottom:1px solid var(--side-line)}
.brand{font-family:var(--f-disp);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b{color:var(--accent)}
.brand-sub{font-size:12px;color:var(--side-ink-2);margin-top:4px}
.grp{padding:10px 10px 4px}
.grp-t{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-ink-2);padding:6px 8px}
.cat-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;color:var(--side-ink)}
.cat-btn:hover{background:var(--side-hover)}
.cat-btn.on{background:var(--accent);color:var(--accent-ink)}
.cat-btn .nm{flex:1;font-weight:500}
.inj-dot{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:10px;padding:1px 6px}
.cat-btn.on .inj-dot{background:rgba(0,0,0,.28)}
.side-foot{margin-top:auto;padding:12px 18px 18px;border-top:1px solid var(--side-line);display:grid;gap:8px}
.side-foot input{background:var(--side-hover);border:1px solid var(--side-line);border-radius:6px;padding:7px 9px;width:100%}
.side-foot .row{display:flex;gap:6px}
.side-foot select{background:var(--side-hover);border:1px solid var(--side-line);border-radius:6px;padding:7px 6px}
.btn-side{background:transparent;border:1px dashed var(--side-ink-2);color:var(--side-ink);border-radius:6px;padding:7px 10px;white-space:nowrap}
.ver{font-size:10.5px;color:var(--side-ink-2);font-family:var(--f-mono)}
.status{font-size:11.5px;color:var(--side-ink-2);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block}
.status.ok i{background:var(--good)}
.scrim{display:none}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding-inline:24px;padding-block:18px 60px}
.top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.burger{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:40px;height:40px;display:grid;place-items:center;flex:0 0 40px}
.burger span{display:block;width:18px;height:2px;background:var(--ink);box-shadow:0 6px 0 var(--ink),0 -6px 0 var(--ink)}
.cat-title{flex:1;min-width:200px}
.eyebrow{font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-size:13px}
h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(32px,5vw,48px);line-height:.95;margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:118px}
.kpi .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-2)}
.tabs{display:flex;gap:2px;margin-top:18px;border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:10px 14px;font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.view{margin-top:18px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
h2{font-family:var(--f-disp);font-weight:700;font-size:24px;text-transform:uppercase;margin:0;letter-spacing:.02em}
h3{font-family:var(--f-disp);font-weight:700;font-size:18px;text-transform:uppercase;margin:0 0 8px;letter-spacing:.04em}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 13px;font-weight:600}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:none;border-color:transparent}
.muted{color:var(--ink-2)}
.tiny{font-size:12px;color:var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--f-disp);font-size:20px;text-transform:uppercase;color:var(--ink);margin-bottom:4px;letter-spacing:.03em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.gym{background:var(--gym-soft);color:var(--gym)}
.chip.cancha{background:var(--cancha-soft);color:var(--cancha)}
.chip.match{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}

/* calendar */
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-month{font-family:var(--f-disp);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em;min-width:190px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden;min-width:660px}
.dow{font-family:var(--f-disp);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--ink-3);padding:7px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.day{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 8px;background:none;border-top:0;border-left:0;text-align:left;display:flex;flex-direction:column;gap:3px;align-items:stretch;cursor:pointer}
.day:hover{background:var(--surface-2)}
.day.out{opacity:.38}
.day .n{font-family:var(--f-disp);font-weight:700;font-size:18px;line-height:1;display:flex;justify-content:space-between;align-items:center}
.day.today .n span:first-child{background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 5px}
.day .att{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}

/* table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
th button.linkish{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.bar-pct{display:inline-block;width:70px;height:6px;background:var(--surface-2);border-radius:3px;vertical-align:middle;margin-right:8px;overflow:hidden}
.bar-pct i{display:block;height:100%}
.delta-up{color:var(--good)} .delta-down{color:var(--bad)}

/* attendance */
.att-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.att-row:last-child{border-bottom:0}
.att-row .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-weight:700;font-size:12.5px;color:var(--ink-3);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.P{background:var(--good);color:#fff}
.seg button.on.A{background:var(--bad);color:#fff}
.seg button.on.J{background:var(--warn);color:#fff}
.seg button.on.L{background:var(--ink-2);color:var(--surface)}
.dates{display:flex;gap:6px;flex-wrap:wrap}
.date-chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12px}
.date-chip.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}

/* matches */
.match-list{display:grid;gap:8px}
.match{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.match .when{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;line-height:1.05}
.match .when .d{font-size:26px}
.match .when .m{font-size:13px;color:var(--ink-3);letter-spacing:.08em}
.match .vs{font-weight:600;font-size:15px}
.score{font-family:var(--f-disp);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.res{font-family:var(--f-disp);font-weight:800;font-size:14px;width:26px;height:26px;border-radius:5px;display:inline-grid;place-items:center;color:#fff;margin-left:8px;vertical-align:4px}
.res.G{background:var(--good)} .res.E{background:var(--warn)} .res.P{background:var(--bad)}

/* testeos */
.ex-chips{display:flex;gap:6px;flex-wrap:wrap}
.ex-chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;font-weight:600;font-size:13px}
.ex-chip small{color:var(--ink-3);font-weight:500;margin-left:4px}
.ex-chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex-chip.on small{color:inherit;opacity:.7}
.spark{display:block}

/* injuries */
.inj-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.inj{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;display:grid;gap:6px;text-align:left}
.inj.readapt{border-left-color:var(--warn)}
.inj .who{font-weight:700;font-size:15px}
.inj .days{font-family:var(--f-disp);font-weight:800;font-size:30px;line-height:1}
.inj .days small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-2)}

/* roster */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.pl{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pl .dor{font-family:var(--f-disp);font-weight:800;font-size:22px;width:34px;text-align:center;color:var(--ink-3)}
.pl .nm{font-weight:600}
.pl .info{flex:1;min-width:0}

/* forms / modal */
.field{display:grid;gap:4px}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field select,.field textarea,.inp{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
.field textarea{min-height:74px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.modal-wrap{position:fixed;inset:0;background:rgba(10,14,12,.5);display:flex;justify-content:flex-end;z-index:50}
.modal{background:var(--surface);width:min(620px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal-h{position:sticky;top:0;background:var(--surface);padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px;z-index:2}
.modal-h .t{flex:1}
.modal-b{padding:16px 20px;display:grid;gap:14px}
.modal-f{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap}
.modal-f .grow{flex:1}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--ink-3);padding:2px 6px}
.stype{display:flex;gap:6px}
.stype button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:center;align-items:center;gap:8px}
.stype button.on.gym{border-color:var(--gym);color:var(--gym);background:var(--gym-soft)}
.stype button.on.cancha{border-color:var(--cancha);color:var(--cancha);background:var(--cancha-soft)}
.stype .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.chip.plan{background:transparent;border:1.5px dashed currentColor;padding:0 5px}
.chip.susp{background:var(--surface-2);color:var(--ink-3);text-decoration:line-through}
.rut-note{background:var(--surface-2);border-left:3px solid var(--ink-3);border-radius:6px;padding:10px 12px;font-size:13px;display:grid;gap:8px}
.rut-acts{display:flex;gap:6px;flex-wrap:wrap}
.rut-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.rut-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.rut-card.fin{opacity:.65}
.rut-name{font-family:var(--f-disp);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.rut-days{font-size:12.5px;color:var(--ink-2)}
.blk-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.blk-title h3{margin:0}
.paste-box{border:1.5px dashed var(--accent);border-radius:10px;padding:12px;display:grid;gap:8px;margin-bottom:12px;background:var(--accent-soft)}
.paste-txt{min-height:190px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px;font-family:var(--f-mono);font-size:13px;line-height:1.5;resize:vertical}
.paste-help{line-height:1.5;color:var(--ink-2)}
.prog-row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:end;background:var(--accent-soft);border-radius:7px;padding:8px}
.prog-row label,.prog-w1{display:grid;gap:2px}
.prog-row small{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.prog-row input{width:92px;padding:5px 7px}
.prog-w1 b{font-size:12px;font-weight:600;color:var(--ink-3);padding:6px 4px}
.prog-help{flex-basis:100%}
.ex-progbtn.on{border-color:var(--accent);color:var(--accent)}
.f-ex-p.prog b{color:var(--accent)}
.f-of{font-style:normal;font-size:15px;color:var(--ink-3)}
.lib-btn{font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--side-line)!important}
.lib-n{font-family:var(--f-mono);font-size:11px;color:inherit;opacity:.7}
.asig-chips{display:flex;gap:5px;flex-wrap:wrap}
.asig-chip{border:1px solid var(--line);background:var(--surface-2);border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}
.asig-chip.prox{border-style:dashed;background:none}
.cat-picks{display:flex;flex-wrap:wrap;gap:6px}
.cat-pick{border:1.5px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--bg);position:relative}
.cat-pick input{position:absolute;opacity:0;pointer-events:none}
.cat-pick.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.cat-pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.sched{display:grid;gap:8px}
.sched-row{display:grid;grid-template-columns:minmax(90px,1fr) auto 110px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.sched-h{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);min-width:0}
@media (max-width:620px){.sched-row{grid-template-columns:1fr 110px}.sched-row .wd-pick{grid-column:1/-1;grid-row:2}}
.cal-seg button{padding:7px 14px;font-size:13px}
.cal-seg button.on{background:var(--ink);color:var(--bg)}

<script>
/* =====================================================================
   CONFIGURACIÓN DE FIREBASE
   Pegá acá los datos de tu proyecto (Firebase > Configuración del
   proyecto > Tus apps > Configuración del SDK). Si lo dejás vacío, la
   app funciona igual pero guarda solo en este navegador.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCqBNmrhDGKtuOzAgW9lSjwraSiXyYvg2o",
  authDomain: "pizarra-pf.firebaseapp.com",
  projectId: "pizarra-pf",
  storageBucket: "pizarra-pf.firebasestorage.app",

};

<script>
(function(){
"use strict";
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pISO=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const TODAY=iso(new Date());
const fmtD=(s,o)=>s?pISO(s).toLocaleDateString('es-AR',o||{weekday:'short',day:'numeric',month:'short'}):'';
const daysBetween=(a,b)=>Math.round((pISO(b)-pISO(a))/864e5);
const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'x';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function toast(msg){const r=$('#toastRoot');r.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>{r.innerHTML='';},2200);}

/* ================= store (db en la nube, con respaldo local) ================= */
function clean(o){return JSON.parse(JSON.stringify(o));}
const Store={
  mode:'loading', fs:null, local:ls.get('pfclub-local',{}), lsubs:[],
  async init(){
    if(!FIREBASE_CONFIG.apiKey||typeof firebase==='undefined'){this.mode='local';return;}
    firebase.initializeApp(FIREBASE_CONFIG);
    this.fs=firebase.firestore();
    try{await this.fs.enablePersistence({synchronizeTabs:true});}catch(e){}
    this.mode='cloud';
  },
  watch(coll,field,val,cb){
    if(this.mode==='cloud'){
      let q=this.fs.collection(coll); if(field) q=q.where(field,'==',val);
      return q.onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data()))), e=>{console.warn(coll,e);handleErr(e);setStatus('err');});
    }
    const sub={coll,field,val,cb}; this.lsubs.push(sub); this._emit(sub);
    return ()=>{this.lsubs=this.lsubs.filter(x=>x!==sub);};
  },
  _emit(sub){const c=this.local[sub.coll]||{};const arr=Object.keys(c).map(id=>Object.assign({id},c[id])).filter(x=>!sub.field||x[sub.field]===sub.val);sub.cb(arr);},
  _changed(coll){ls.set('pfclub-local',this.local);this.lsubs.filter(s=>s.coll===coll).forEach(s=>this._emit(s));},
  /* En la nube no esperamos la confirmación del servidor: Firestore aplica el cambio
     al toque en pantalla y lo sube cuando hay señal (sirve en la cancha sin wifi). */
  async put(coll,id,data){
    if(this.mode==='cloud'){ this.fs.collection(coll).doc(id).set(clean(data)).catch(handleErr); return; }
    (this.local[coll]=this.local[coll]||{})[id]=clean(data); this._changed(coll);
  },
  async getAll(coll){
    if(this.mode==='cloud'){const s=await this.fs.collection(coll).get();const o={};s.docs.forEach(d=>o[d.id]=d.data());return o;}
    return clean(this.local[coll]||{});
  },
  async putMany(coll,obj){
    const ids=Object.keys(obj);
    if(this.mode==='cloud'){
      for(let i=0;i<ids.length;i+=400){const b=this.fs.batch();ids.slice(i,i+400).forEach(id=>b.set(this.fs.collection(coll).doc(id),clean(obj[id])));await b.commit();}
      return;
    }
    this.local[coll]=this.local[coll]||{};ids.forEach(id=>this.local[coll][id]=clean(obj[id]));this._changed(coll);
  },
  async remove(coll,id){
    if(this.mode==='cloud'){ this.fs.collection(coll).doc(id).delete().catch(handleErr); return; }
    if(this.local[coll]) delete this.local[coll][id]; this._changed(coll);
  }
};
function handleErr(e){
  const c=e&&e.code;
  if(c==='permission-denied') toast('Tu cuenta no tiene permiso. Revisá las reglas de Firebase.');
  else if(c==='resource-exhausted') toast('Se llegó al límite gratuito de Firebase por hoy.');
  else toast('No se pudo guardar. Probá de nuevo.');
}
function setStatus(kind){
  const el=$('#status');const u=Store.mode==='cloud'&&firebase.auth().currentUser;
  if(kind==='cloud'){el.className='status ok';el.innerHTML='<i></i><span>Sincronizado · '+esc(u?u.email:'')+'</span><button id="logout">Salir</button>';
    $('#logout').onclick=()=>firebase.auth().signOut().then(()=>location.reload());}
  else if(kind==='local'){el.className='status';el.innerHTML='<i></i><span>Guardado solo en este navegador</span>';}
  else if(kind==='err'){el.className='status';el.innerHTML='<i></i><span>Problema de conexión</span>';}
}

/* ================= constantes ================= */
const DEFAULT_CATS=[['primera-masc','Primera masculino','Primera'],['primera-fem','Primera femenino','Primera'],['u21-a','U21 A','U21'],['u21-b','U21 B','U21'],['u21-fem','U21 femenino','U21'],['u17-a','U17 A','U17'],['u17-b','U17 B','U17'],['u17-fem','U17 femenino','U17'],['u15-a','U15 A','U15'],['u15-b','U15 B','U15'],['u15-fem','U15 femenino','U15'],['u13-a','U13 A','U13'],['u13-b','U13 B','U13'],['u13-fem','U13 femenino','U13']];
const EXERCISES=[
  {k:'sentadilla',n:'Sentadilla',u:'kg'},{k:'peso-muerto',n:'Peso muerto',u:'kg'},{k:'banco-plano',n:'Banco plano',u:'kg'},{k:'hip-thrust',n:'Hip thrust',u:'kg'},{k:'press-militar',n:'Press militar',u:'kg'},
  {k:'cmj',n:'CMJ',u:'cm'},{k:'sj',n:'SJ',u:'cm'},{k:'drop-jump',n:'Drop jump',u:'cm'},{k:'rsi',n:'RSI (drop)',u:'m/s'},
  {k:'sprint-10',n:'Sprint 10 m',u:'s',low:true},{k:'sprint-30',n:'Sprint 30 m',u:'s',low:true},{k:'yoyo-ir1',n:'Yo-Yo IR1',u:'m'}
];
const DEFAULT_LIB=['Sentadilla trasera','Sentadilla frontal','Sentadilla búlgara','Peso muerto','Peso muerto rumano','Hip thrust','Puente de glúteos','Banco plano','Press militar','Remo con barra','Remo con mancuerna','Dominadas','Estocadas','Step up','Nórdicos','Copenhagen','Curl femoral','Extensión de cuádriceps','Elevación de gemelos','Press Pallof','Plancha','Plancha lateral','Curl de bíceps','Tríceps en polea','CMJ','Saltos al cajón','Drop jump','Saltos con vallas','Skipping','Sprint 10 m','Sprint 30 m','Cambios de dirección'];
const COLLS=['config','categorias','rutinas','asignaciones','ideales','testeosLista','jugadores','sesiones','partidos','asistencia','testeos','lesiones','ejercicios'];
const ZONAS=['Isquiotibiales','Cuádriceps','Aductores','Gemelos / sóleo','Tobillo','Rodilla','Cadera / pubis','Lumbar','Hombro','Muñeca / mano','Cabeza','Otra'];
const TABS=[['calendario','Calendario'],['rutinas','Rutinas'],['asistencia','Asistencia'],['partidos','Partidos'],['estadisticas','Estadísticas'],['testeos','Testeos'],['lesionados','Lesionados'],['plantel','Plantel']];
const ATT=[['P','Presente'],['A','Ausente'],['J','Justificado'],['L','Lesionado']];

/* ================= estado ================= */
const S={
  cats:[], cat:ls.get('pf-cat',null), tab:ls.get('pf-tab','calendario'),
  calView:ls.get('pf-calview','mes'), calDate:TODAY,
  jug:[], ses:[], par:[], asis:[], tes:[], lesAll:[], lib:[], rutAll:[], asigAll:[], ideales:[], testList:[], cfg:[], sesHoy:[], parHoy:[], sesMan:[], parMan:[], stMode:'prom', stSort:'min', libQ:'', view:ls.get('pf-view','cat'),
  attDate:TODAY, exSel:ls.get('pf-ex','sentadilla'), catsLoaded:false
};
let catUnsubs=[];
const lesOf=()=>S.lesAll.filter(l=>l.cat===S.cat);
const activeInj=l=>l.estado!=='alta';
const jugName=id=>{const j=S.jug.find(x=>x.id===id);return j?j.nombre:'(jugador borrado)';};
const sortedJug=()=>S.jug.slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));

/* ================= sidebar ================= */
const app=$('#app');
function setSide(open){app.classList.toggle('side-off',!open);ls.set('pf-side',open);}
setSide(window.innerWidth>860?ls.get('pf-side',true):false);
$('#burger').onclick=()=>setSide(app.classList.contains('side-off'));
$('#scrim').onclick=()=>setSide(false);

function renderNav(){
  const groups={};
  S.cats.slice().sort((a,b)=>(a.orden||0)-(b.orden||0)).forEach(c=>{(groups[c.grupo||'Otras']=groups[c.grupo||'Otras']||[]).push(c);});
  const injCount={};S.lesAll.filter(activeInj).forEach(l=>{injCount[l.cat]=(injCount[l.cat]||0)+1;});
  let h='';
  Object.keys(groups).forEach(g=>{
    h+='<div class="grp"><div class="grp-t">'+esc(g)+'</div>';
    groups[g].forEach(c=>{
      const n=injCount[c.id];
      h+='<button class="cat-btn'+(c.id===S.cat&&S.view!=='lib'?' on':'')+'" data-cat="'+esc(c.id)+'"><span class="nm">'+esc(c.nombre)+'</span>'+(n?'<span class="inj-dot" title="Lesionados activos">'+n+'</span>':'')+'</button>';
    });
    h+='</div>';
  });
  if(!S.cats.length) h='<div class="grp"><div class="grp-t">Sin categorías</div><div style="padding:0 8px;color:var(--side-ink-2);font-size:13px">Sumá la primera abajo.</div></div>';

  $('#catNav').innerHTML=h;
}
$('#catNav').addEventListener('click',e=>{
  if(e.target.closest('[data-agopen]')){AG.day=TODAY;setAg('open');if(window.innerWidth<=860)setSide(false);return;}
  if(e.target.closest('[data-lib]')){S.view='lib';ls.set('pf-view','lib');renderNav();render();if(window.innerWidth<=860)setSide(false);return;}
  const b=e.target.closest('[data-cat]');if(!b)return;S.view='cat';ls.set('pf-view','cat');selectCat(b.dataset.cat);if(window.innerWidth<=860)setSide(false);});
$('#catForm').addEventListener('submit',async e=>{
  e.preventDefault();const nm=$('#newCatName').value.trim();if(!nm)return;
  const id=slug(nm);const g=(nm.match(/^(u\d+|primera|reserva)/i)||[''])[0];
  await Store.put('categorias',id,{nombre:nm,grupo:g?g.toUpperCase().replace('PRIMERA','Primera').replace('RESERVA','Reserva'):'Otras',orden:(S.cats.length+1)*10});
  $('#newCatName').value='';selectCat(id);toast('Categoría sumada');
});

function selectCat(id){
  if(!S.cats.find(c=>c.id===id)&&S.cats.length) id=S.cats.slice().sort((a,b)=>(a.orden||0)-(b.orden||0))[0].id;
  if(!id) return;
  const changed=id!==S.cat||!catUnsubs.length;
  S.cat=id;ls.set('pf-cat',id);
  if(changed){
    catUnsubs.forEach(u=>{try{u();}catch(e){}});
    S.jug=[];S.ses=[];S.par=[];S.asis=[];S.tes=[];
    catUnsubs=[
      Store.watch('jugadores','cat',id,a=>{S.jug=a;render();}),
      Store.watch('sesiones','cat',id,a=>{S.ses=a;render();}),
      Store.watch('partidos','cat',id,a=>{S.par=a;render();}),
      Store.watch('asistencia','cat',id,a=>{S.asis=a;if(!pendingAtt)render();}),
      Store.watch('testeos','cat',id,a=>{S.tes=a;render();})
    ];
  }
  renderNav();render();
}

/* ================= editar categoría ================= */
function openCat(){
  const c=S.cats.find(x=>x.id===S.cat);if(!c)return;
  const groups=[...new Set(S.cats.map(x=>x.grupo).filter(Boolean))];
  const b='<div class="form-grid"><div class="field" style="grid-column:1/-1"><label for="c_n">Nombre</label><input id="c_n" value="'+esc(c.nombre)+'"></div>'+
    '<div class="field" style="grid-column:1/-1"><label for="c_g">Grupo en el menú</label><input id="c_g" list="grpList" value="'+esc(c.grupo||'')+'" placeholder="Ej: U13"><datalist id="grpList">'+groups.map(g=>'<option value="'+esc(g)+'"></option>').join('')+'</datalist></div>'+
    '<div class="field"><label for="c_r">Rama</label><select id="c_r"><option value="f"'+(catRama(c)==='f'?' selected':'')+'>Femenino</option><option value="m"'+(catRama(c)==='m'?' selected':'')+'>Masculino</option></select></div></div>'+
    '<div class="field"><label>Posición en el menú</label><div style="display:flex;gap:8px"><button type="button" class="btn sm" id="c_up">↑ Subir</button><button type="button" class="btn sm" id="c_dn">↓ Bajar</button></div></div>'+
    '<p class="tiny" style="margin:0">Cambiar el nombre no afecta nada de lo cargado: plantel, sesiones, asistencia, testeos y lesiones siguen en esta categoría.</p>';
  openModal(modalHead('Categoría','Editar '+c.nombre)+'<div class="modal-b">'+b+'</div><div class="modal-f"><button class="btn danger" id="c_del">Borrar categoría</button><div class="grow"></div><button class="btn" data-close>Cancelar</button><button class="btn pri" id="c_save">Guardar</button></div>',mw=>{
    const move=dir=>{
      const list=S.cats.slice().sort((a,b)=>(a.orden||0)-(b.orden||0));
      const i=list.findIndex(x=>x.id===c.id),j=i+dir;if(j<0||j>=list.length)return;
      [list[i],list[j]]=[list[j],list[i]];
      list.forEach((x,k)=>{const o=(k+1)*10;if(x.orden!==o){const d=Object.assign({},x,{orden:o});delete d.id;x.orden=o;Store.put('categorias',x.id,d);}});

const RX_PRES=/(\d{1,2})\s*[x×X*]\s*(\d+(?:[.,]\d+)?(?![\d.,]*\s*(?:kg|%|lb))\s*(?:''|"|″|′|'|s|seg|m|min)?(?:\s*[-\/,]\s*\d+(?:[.,]\d+)?(?![\d.,]*\s*(?:kg|%|lb))\s*(?:''|"|″|′|'|s|seg|m|min)?)*)/;
const RX_SDE=/(\d{1,2})\s*series?\s*(?:de|x)\s*(\d+(?:\s*[-\/,]\s*\d+)*)/i;
const RX_LIST=/(?:^|\s)(\d+(?:\s*[-\/]\s*\d+){1,11})(?=\s|$)/;
const RX_HEAD=/^(bloque|circuito|superserie|biserie|triserie|parte|serie\s+[a-z\d]|activaci[oó]n|core|potencia|fuerza|accesorios?)\b/i;
function splitReps(str){return str.split(/\s*[-\/,]\s*/).map(x=>x.trim()).filter(Boolean);}
function parseExercise(line){
  const parts=line.split(/\s+\/\s+|\s*\|\s*/);
  if(parts.length>1&&parts.slice(1).every(p=>/^\d{1,2}\s*[x×X*]\s*\d/.test(p.trim())||/^@?\s*\d+(?:[.,]\d+)?\s*(?:%|kg|x\s*pc|reps?)/i.test(p.trim())||/^\d{1,3}(?:\s*[-\/]\s*\d{1,3})*$/.test(p.trim()))){const e=parseExercise(parts[0]);e.prog=['',...parts.slice(1).map(x=>x.trim())];return e;}
  let link='';
  line=line.replace(/(https?:\/\/\S+|(?:www\.)?(?:youtu\.be|youtube\.com|drive\.google\.com)\/\S+)/i,m=>{link=m;return ' ';});
  line=line.replace(/^\s*(?:[-•*·–]+|\d{1,2}[.)]|[a-z]\d{1,2}[.):-]?|[a-z][.)])\s+/i,'').trim();
  let m,series='',reps=[],name=line,rest='',raw='',expl=false;
  if((m=line.match(RX_PRES))){series=m[1];raw=m[2];expl=true;reps=splitReps(m[2]);name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  else if((m=line.match(RX_SDE))){series=m[1];raw=m[2];expl=true;reps=splitReps(m[2]);name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  else if((m=line.match(RX_LIST))){reps=splitReps(m[1]);series=String(reps.length);name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  else if((m=line.match(/\s[x×]\s*(\d+)\b/))){reps=[m[1]];name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  name=name.replace(/[\s:,\-–(]+$/,'').trim();
  const c=rest.replace(/^[\s,;:\-–@)]+/,'').replace(/[\s,;(]+$/,'').trim();
  /* "3x8-8" (por lado) o "3x12/15" (rango): si la cantidad no coincide con las series, se respeta tal cual */
  if(expl&&reps.length>1&&reps.length!==+series)return {n:name,series,reps:[raw.replace(/\s+/g,'').trim()],dist:false,c,link};
  const uniq=[...new Set(reps)];
  const dist=reps.length>1&&uniq.length>1;
  return {n:name,series,reps:dist?reps:[uniq[0]||''],dist,c,link};
}
function parseRoutineText(txt){
  const lines=txt.replace(/\r/g,'').split('\n');
  const blocks=[];let cur=null;let blankBreak=false;
  const hasHeaders=lines.some(l=>{const t=l.trim();return t&&!RX_PRES.test(t)&&(RX_HEAD.test(t)||/:\s*$/.test(t));});
  const newBlock=(nombre,series)=>{cur={nombre:nombre||('Bloque '+(blocks.length+1)),series:series||'',nota:'',ejercicios:[]};blocks.push(cur);};
  lines.forEach(raw=>{
    const t=raw.trim();
    if(!t){blankBreak=true;return;}
    const isHead=!RX_PRES.test(t)&&!RX_SDE.test(t.replace(/^.*?(\d+\s*series?\s*de)/i,'$1'))&&(RX_HEAD.test(t)||/:\s*$/.test(t));
    if(isHead){
      const sm=t.match(/(\d{1,2})\s*(?:series|sets|vueltas|rondas)/i);
      const nombre=t.replace(/(\(|[-–:,]\s*)?\d{1,2}\s*(?:series|sets|vueltas|rondas)\)?/i,'').replace(/[\s:\-–]+$/,'').trim();
      newBlock(nombre,sm?sm[1]:'');blankBreak=false;return;
    }
    if(/^(pausa|descanso|nota|obs)/i.test(t)&&cur){cur.nota=(cur.nota?cur.nota+' · ':'')+t;return;}
    if(!cur||(blankBreak&&!hasHeaders&&cur.ejercicios.length))newBlock();
    blankBreak=false;
    const e=parseExercise(t);if(e.n)cur.ejercicios.push(e);
  });
  blocks.forEach(b=>{
    const ss=b.ejercicios.map(e=>e.series).filter(Boolean);
    if(!b.series&&ss.length===b.ejercicios.length&&ss.length&&new Set(ss).size===1)b.series=ss[0];
    b.ejercicios.forEach(e=>{if(e.series&&e.series===b.series)e.series='';});
  });
  return blocks.filter(b=>b.ejercicios.length||b.nota);
}

/* ---------- rutinas: proyección en el calendario ---------- */
const WD=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const WDL=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const wdOf=f=>(pISO(f).getDay()+6)%7;
const addDays=(f,n)=>{const d=pISO(f);d.setDate(d.getDate()+n);return iso(d);};
const rutActive=(r,f)=>r.desde&&f>=r.desde&&(!r.hasta||f<=r.hasta);
function rutState(r){if(r.hasta&&r.hasta<TODAY)return 'fin';if(r.desde>TODAY)return 'prox';return 'vig';}
/* Días de una rutina. Las rutinas viejas (un solo contenido para varios días) se convierten al vuelo. */
function rutDays(r){
  if(r.sesiones&&r.sesiones.length)return r.sesiones;
  const base={};['objetivo','duracion','rpe','calor','bloques','ejercicios','principal','calma','notas'].forEach(k=>{if(r[k]!=null)base[k]=r[k];});
  if(base.ejercicios&&!base.bloques){base.bloques=toBloques(base,r.tipo);}delete base.ejercicios;
  return (r.dias||[]).slice().sort((a,b)=>a.d-b.d).map((x,i)=>Object.assign(JSON.parse(JSON.stringify(base)),{nombre:'Día '+(i+1),d:x.d,hora:x.hora||''}));
}
const weekIdx=(r,f)=>Math.max(0,Math.floor(daysBetween(r.desde,f)/7));
function applyProg(e,b,txt){
  const o=Object.assign({},e);txt=String(txt).trim();
  const p=parseExercise('X '+txt);
  if(!p.series&&!(p.reps.length>1||p.reps[0]!=='')){
    /* la semana solo cambia reps ("12 reps") o carga ("75%", "80kg", "1.5xPC") */
    /* "6" o "6 reps" = repeticiones; "6 reps 80kg" = reps + carga */
    const m=txt.match(/^(\d{1,3})(?:\s*(?:reps?|repeticiones)\b\s*(.*))?$/i);
    if(m){o.reps=[m[1]];o.dist=false;if(m[2]&&m[2].trim())o.c=m[2].replace(/^[\s,;:\-–@]+/,'').trim();}
    else o.c=txt.replace(/^@\s*/,'');
    return o;
  }
  /* solo reps sin "x" (ej. "8-8", "12/15", "8-6-4"): si la cantidad no coincide con las series, es por lado o rango */
  const lm=txt.match(/^(\d+(?:\s*[-\/,]\s*\d+)+)/);
  if(!/[x×*]/i.test(txt)&&lm){
    const eff=+(e.series||b.series||0),n=lm[1].split(/\s*[-\/,]\s*/).length;
    if(eff&&n!==eff){o.reps=[lm[1].replace(/\s+/g,'')];o.dist=false;const rest=txt.slice(lm[0].length).replace(/^[\s,;:\-–@]+/,'').trim();if(rest)o.c=rest;return o;}
  }
  if(p.series)o.series=p.series;
  const hasR=p.reps.length>1||p.reps[0]!=='';
  if(hasR){o.reps=p.reps;o.dist=p.reps.length>1;if(!p.series&&o.dist)o.series=String(p.reps.length);}
  if(p.c)o.c=p.c;
  return o;
}
function resolveDay(dd,w){
  const c=JSON.parse(JSON.stringify(dd));
  (c.bloques||[]).forEach(b=>{b.ejercicios=(b.ejercicios||[]).map(e=>{
    const pr=e.prog||[];let t='';
    for(let j=Math.min(w,pr.length-1);j>=1;j--){if(pr[j]){t=pr[j];break;}}
    const o=t?applyProg(e,b,t):Object.assign({},e);
    if(t&&w>0)o.progW=1;delete o.prog;return o;
  });});
  return c;
}
function sessionsOn(f){
  const conc=S.ses.filter(s=>s.fecha===f).map(s=>Object.assign({src:'ses'},s));
  const out=conc.slice();const wd=wdOf(f);
  S.asigAll.forEach(a=>{
    if(a.cat!==S.cat||!rutActive(a,f))return;
    const r=rutById(a.rutina);if(!r)return;
    const di=(a.horario||[]).findIndex(x=>x&&x.d===wd);if(di<0)return;
    const dd=rutDays(r)[di];if(!dd)return;
    if(conc.some(c=>c.tipo===r.tipo&&(c.rutina===r.id||!c.rutina)))return;
    out.push({src:'rut',tipo:r.tipo,objetivo:dd.nombre+' · '+r.nombre,hora:(a.horario[di]||{}).hora||'',rut:r,asig:a,dia:dd});
  });
  return out.sort((a,b)=>(a.hora||'').localeCompare(b.hora||'')||a.tipo.localeCompare(b.tipo));
}

/* ---------- cargas por jugador (%RM y ×peso corporal) ---------- */
function parseLoad(c){
  c=String(c||'').replace(/,/g,'.');
  let m=c.match(/(\d+(?:\.\d+)?)\s*(?:[-–a]\s*(\d+(?:\.\d+)?))?\s*[x×]\s*(?:pc|p\.?c\.?|peso)/i);
  if(m)return {type:'pc',a:+m[1],b:m[2]?+m[2]:null};
  m=c.match(/(\d+(?:\.\d+)?)\s*%?\s*(?:[-–a]\s*(\d+(?:\.\d+)?))?\s*%\s*(?:de\s*)?(?:1?\s*rm)?/i);
  if(m)return {type:'rm',a:+m[1]/100,b:m[2]?+m[2]/100:null};
  return null;
}
const round25=x=>Math.round(x/2.5)*2.5;
function testKeyFor(name){
  const k=slug(name);const lib=S.lib.find(x=>x.id===k);
  if(lib&&lib.test)return lib.test;
  const exs=allExercises().filter(e=>e.u==='kg');
  const exact=exs.find(e=>e.k===k||slug(e.n)===k);if(exact)return exact.k;
  const part=exs.filter(e=>k.includes(e.k)||k.includes(slug(e.n))).sort((a,b)=>b.k.length-a.k.length)[0];
  return part?part.k:'';
}
function lastRM(jid,key){
  let out=null;
  S.tes.filter(t=>t.ejercicio===key).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(t=>{const v=(t.valores||{})[jid];if(v!==''&&v!=null)out={rm:Number(v),t};});
  return out;
}
function loadRows(e,key,L){
  return sortedJug().map(j=>{
    const lr=key?lastRM(j.id,key):null;const bw=bwOf(j.id,lr&&lr.t);
    const rm=lr?lr.rm:null;
    const calc=f=>{
      if(L.type==='rm'){if(!rm)return null;const kg=round25(rm*f);return {kg,pct:kg/rm,pc:bw?kg/bw:null};}
      if(!bw)return null;const kg=round25(bw*f);return {kg,pct:rm?kg/rm:null,pc:f};
    };
    return {j,rm,bw,lo:calc(L.a),hi:L.b?calc(L.b):null};
  });
}

      return '<tr><td>'+esc(r.j.nombre)+'</td><td class="r mono">'+(k?'<b class="ld-kg">'+k+'</b>':'<span class="tiny warn-t">'+why+'</span>')+'</td>'+
        '<td class="r mono">'+(over?'<span class="pill bad" title="Supera su 1RM">'+pctT+'</span>':pctT)+'</td><td class="r mono">'+pcT+'</td>'+
        '<td class="r mono">'+(r.rm?fmtN(r.rm)+' kg':'–')+'</td><td class="r mono">'+(r.bw?fmtN(r.bw)+' kg':'–')+'</td></tr>';
    }).join('')+'</tbody></table></div></div>';
  return h;
}
function openLoads(s,tipo,fecha,only){

/* ---------- ficha de sesión (solo lectura) ---------- */
function prescripcion(e,b){
  const ser=e.series||b.series||'';
  const reps=(e.reps||[]).filter(x=>x!=='');
  let r='';
  if(reps.length) r=e.dist?reps.join('-'):reps[0];
  if(ser&&r) return '<b>'+esc(ser)+'</b><i>×</i><b>'+esc(r)+'</b>';
  if(r) return '<b>'+esc(r)+'</b>';
  if(ser) return '<b>'+esc(ser)+'</b> <i>series</i>';
  return '';
}
function fichaText(t,label){return t?'<div class="f-sec"><div class="f-lbl">'+label+'</div><div class="f-txt">'+esc(t)+'</div></div>':'';}
function fichaHtml(s,tipo,fecha,rut){
  const meta=[];
  if(s.hora)meta.push('<span><small>Hora</small><b>'+esc(s.hora)+'</b></span>');
  if(s.duracion)meta.push('<span><small>Duración</small><b>'+esc(s.duracion)+'′</b></span>');
  if(s.rpe)meta.push('<span><small>RPE</small><b>'+esc(s.rpe)+'</b></span>');
  if(s.semana)meta.push('<span><small>Semana</small><b>'+s.semana+(s.semTot?'<i class="f-of">/'+s.semTot+'</i>':'')+'</b></span>');
  if(s.micro)meta.push('<span><small>Microciclo</small><b>'+esc(s.micro)+'</b></span>');
  const bloques=toBloques(s,tipo).filter(b=>(b.ejercicios||[]).some(e=>e.n)||b.nota);
  let h='<div class="ficha '+tipo+'">'+
    (rut?'<div class="f-top"><span class="f-src">'+(s.rutDia?esc(s.rutDia)+' · ':'')+esc(rut.nombre)+'</span></div>':'')+
    (s.objetivo?'<div class="f-obj">'+esc(s.objetivo)+'</div>':'')+
    (meta.length?'<div class="f-meta">'+meta.join('')+'</div>':'')+
    fichaText(s.calor,tipo==='gym'?'Entrada en calor / activación':'Entrada en calor');
  if(bloques.length){
    h+='<div class="f-blocks">'+bloques.map((b,bi)=>{
      const L=String.fromCharCode(65+bi);
      const ej=(b.ejercicios||[]).filter(e=>e.n);
      return '<div class="f-blk"><div class="f-blk-h"><span class="f-blk-l">'+L+'</span><span class="f-blk-n">'+esc(b.nombre||('Bloque '+(bi+1)))+'</span>'+(b.series?'<span class="f-blk-s">'+esc(b.series)+' series</span>':'')+'</div>'+
        (b.nota?'<div class="f-blk-nota">'+esc(b.nota)+'</div>':'')+
        ej.map((e,ei)=>'<div class="f-ex"><span class="f-ex-i">'+L+(ei+1)+'</span><span class="f-ex-n">'+esc(e.n)+
          (e.link?' <a class="vid" href="'+esc(fixUrl(e.link))+'" target="_blank" rel="noopener">▶ Video</a>':'')+(e.obs?'<i class="f-ex-obs">'+esc(e.obs)+'</i>':'')+'</span>'+
          '<span class="f-ex-p'+(e.progW?' prog':'')+'"'+(e.progW?' title="Cambia esta semana"':'')+'>'+prescripcion(e,b)+'</span><span class="f-ex-c">'+(e.c?esc(e.c):'')+(fecha&&parseLoad(e.c)?'<button type="button" class="ld-btn" data-loads="'+bi+':'+ei+'" data-lday="'+fecha+'" data-ltipo="'+tipo+'">kg por jugador</button>':'')+'</span></div>').join('')+
      '</div>';
    }).join('')+'</div>';
  }
  if(tipo==='cancha'){h+=fichaText(s.principal,'Parte principal')+fichaText(s.calma,'Vuelta a la calma');}
  h+=fichaText(s.notas,'Notas');
  if(!bloques.length&&!s.calor&&!s.principal&&!s.notas&&!s.objetivo)h+='<div class="empty" style="padding:18px"><b>Sesión sin contenido</b>Tocá Editar para cargarla.</div>';
  return h+'</div>';
}

/* ---------- sesión del día ---------- */
function openDay(fecha,tipo,edit){
  const list=sessionsOn(fecha);
  const pick=t=>list.find(x=>x.tipo===t);
  if(!tipo) tipo=pick('gym')&&!pick('cancha')?'gym':'cancha';
  const cur=pick(tipo);
  let s={},exists=false,rut=null,asg=null;
  if(cur&&cur.src==='ses'){s=cur;exists=true;rut=cur.rutina?rutById(cur.rutina):null;}
  else if(cur&&cur.src==='rut'){rut=cur.rut;asg=cur.asig;const w=weekIdx(asg,fecha);s=resolveDay(cur.dia,w);s.hora=cur.hora;s.rutDia=cur.dia.nombre;s.semana=w+1;s.semTot=asg.semanas||0;}
  const docId=S.cat+'__'+fecha+'__'+tipo;
  if(!edit&&!s.suspendida&&(exists||rut)){
    const catN0=(S.cats.find(c=>c.id===S.cat)||{}).nombre||'';
    let fb='<div class="stype">'+['gym','cancha'].map(t=>'<button type="button" class="'+t+(t===tipo?' on':'')+'" data-stype="'+t+'"><span class="dot"'+(pick(t)?'':' style="opacity:.2"')+'></span>'+(t==='gym'?'Gym':'Cancha')+'</button>').join('')+'</div>';
    fb+=S.par.filter(p=>p.fecha===fecha).map(p=>'<div class="day-match">Partido: vs '+esc(p.rival)+(p.hora?' · '+esc(p.hora)+' h':'')+'</div>').join('');
    const pend=Draft.get('ses-'+docId);
    if(pend)fb+='<div class="draft-note"><span>Tenés cambios sin guardar en este día.</span><button type="button" class="btn sm pri" id="goDraft">Seguir editando</button></div>';
    fb+=fichaHtml(s,tipo,fecha,rut);
    if(rut&&exists)fb+='<p class="tiny" style="margin:0">Este día está modificado a partir de la rutina.</p>';
    const ff='<div class="modal-f">'+(rut&&!exists?'<button class="btn" id="suspend">Suspender este día</button>':'')+(rut&&exists?'<button class="btn" id="backRut">Volver a la rutina original</button>':'')+
      '<div class="grow"></div>'+(toBloques(s,tipo).some(b=>(b.ejercicios||[]).some(e=>e.n&&parseLoad(e.c)))?'<button class="btn" id="toLoads">Cargas por jugador</button>':'')+'<button class="btn" id="goAtt">Tomar asistencia</button><button class="btn pri" id="toEdit">Editar</button></div>';
    openModal(modalHead(catN0,fmtD(fecha,{weekday:'long',day:'numeric',month:'long'}))+'<div class="modal-b">'+fb+'</div>'+ff,mw=>{
      const q=id=>mw.querySelector('#'+id);

      q('toEdit').onclick=()=>openDay(fecha,tipo,true);
      if(q('goDraft'))q('goDraft').onclick=()=>openDay(fecha,tipo,true);
      if(q('toLoads'))q('toLoads').onclick=()=>openLoads(s,tipo,fecha);
      q('goAtt').onclick=()=>{closeModal();S.attDate=fecha;S.tab='asistencia';ls.set('pf-tab',S.tab);render();};
      if(q('suspend'))armDelete(q('suspend'),async()=>{await Store.put('sesiones',docId,{cat:S.cat,fecha,tipo,hora:s.hora||'',rutina:rut.id,rutDia:s.rutDia||'',suspendida:true});closeModal();toast('Día suspendido');});
      if(q('backRut'))armDelete(q('backRut'),async()=>{await Store.remove('sesiones',docId);closeModal();toast('Volvió a la rutina original');});
    });
    return;
  }
  const matches=S.par.filter(p=>p.fecha===fecha);
  const catN=(S.cats.find(c=>c.id===S.cat)||{}).nombre||'';
  let b='<div class="stype">'+['gym','cancha'].map(t=>'<button type="button" class="'+t+(t===tipo?' on':'')+'" data-stype="'+t+'"><span class="dot"'+(pick(t)?'':' style="opacity:.2"')+'></span>'+(t==='gym'?'Gym':'Cancha')+'</button>').join('')+'</div>';
  b+=matches.map(p=>'<div class="day-match">Partido: vs '+esc(p.rival)+(p.hora?' · '+esc(p.hora)+' h':'')+(p.condicion?' · '+esc(p.condicion):'')+'</div>').join('');
  let foot;
  if(s.suspendida){
    b+='<div class="rut-note"><b>Día suspendido.</b> '+(rut?'La rutina <b>'+esc(rut.nombre)+'</b> no se hace este día.':'')+'<div class="rut-acts"><button type="button" class="btn sm" id="reactivar">Reactivar el día</button></div></div>';
    foot='<div class="modal-f"><div class="grow"></div><button class="btn" data-close>Cerrar</button></div>';
  } else {
    if(rut&&!exists) b+='<div class="rut-note">Viene de la rutina <b>'+esc(rut.nombre)+'</b>'+(s.rutDia?' · <b>'+esc(s.rutDia)+'</b>':'')+' ('+esc(vigText(asg||{}))+'). Si cambiás algo acá, se guarda solo para este día.<div class="rut-acts"><button type="button" class="btn sm" id="editRut">Editar la rutina</button><button type="button" class="btn sm" id="suspend">Suspender este día</button></div></div>';

    const dr=Draft.get('ses-'+docId);

    b+=contentHtml(s,tipo);
    foot='<div class="modal-f">'+(exists&&!rut?'<button class="btn danger" id="delSes">Borrar sesión</button>':'')+'<button class="btn" id="goAtt">Tomar asistencia</button><div class="grow"></div><button class="btn" '+(exists||rut?'id="toFicha"':'data-close')+'>Cancelar</button><button class="btn pri" id="saveSes">Guardar</button></div>';

    const q=id=>mw.querySelector('#'+id);
    if(q('reactivar'))q('reactivar').onclick=async()=>{await Store.remove('sesiones',docId);closeModal();toast('Día reactivado');};
    if(s.suspendida)return;
    wireContent(mw);
    if(q('editRut'))q('editRut').onclick=()=>openRut(rut.id);
    if(q('suspend'))q('suspend').onclick=async()=>{await Store.put('sesiones',docId,{cat:S.cat,fecha,tipo,hora:s.hora||'',rutina:rut.id,rutDia:s.rutDia||'',suspendida:true});closeModal();toast('Día suspendido');};
    if(q('backRut'))armDelete(q('backRut'),async()=>{await Store.remove('sesiones',docId);closeModal();toast('Volvió a la rutina original');});
    q('goAtt').onclick=()=>{closeModal();S.attDate=fecha;S.tab='asistencia';ls.set('pf-tab',S.tab);render();};
    if(q('toFicha'))q('toFicha').onclick=()=>openDay(fecha,tipo);
    if(q('delSes'))armDelete(q('delSes'),async()=>{Draft.del('ses-'+docId);await Store.remove('sesiones',docId);closeModal();toast('Sesión borrada');});
    const dkey='ses-'+docId;let dt;
    const autosave=()=>{clearTimeout(dt);dt=setTimeout(()=>{if(q('saveSes'))Draft.set(dkey,{content:readContent(mw,tipo)});},400);};
    mw.addEventListener('input',autosave);mw.addEventListener('change',autosave);
    mw.addEventListener('click',e=>{if(e.target.closest('.modal-b button'))autosave();});
    const drop=()=>{clearTimeout(dt);Draft.del(dkey);};
    mw.querySelectorAll('[data-close]').forEach(x=>x.addEventListener('click',drop));
    if(q('toFicha'))q('toFicha').addEventListener('click',drop,true);
    if(q('dropDraft'))q('dropDraft').onclick=()=>{drop();openDay(fecha,tipo,true);};
    q('saveSes').onclick=async()=>{
      const data=Object.assign({cat:S.cat,fecha,tipo,rutina:rut?rut.id:'',rutDia:s.rutDia||''},readContent(mw,tipo));
      try{await Store.put('sesiones',docId,data);drop();saveToLibrary(data.bloques);closeModal();toast('Sesión guardada');}catch(e){}
    };
  });
}

/* ---------- imprimir rutina como planilla ---------- */
function printRut(rid,aid){const r=rutById(rid);if(!r)return;printRutObj(r,aid?S.asigAll.find(x=>x.id===aid):null);}
function printRutObj(r,a){
  const ds=rutDays(r);
  const W=(a&&a.semanas)||r.semanas||4;
  const anyProg=ds.some(d=>(d.bloques||[]).some(b=>(b.ejercicios||[]).some(e=>(e.prog||[]).some(Boolean))));
  const weeks=anyProg?W:1;
  const meta=[r.tipo==='cancha'?'Cancha':'Gimnasio'];
  if(a){meta.push(catName(a.cat));meta.push(vigText(a));}else meta.push(W+(W===1?' semana':' semanas'));
  let h='<header class="p-head"><h1>'+esc(r.nombre||'Rutina')+'</h1><div class="p-meta">'+meta.map(esc).join(' · ')+'</div></header>';
  ds.forEach((d,di)=>{
    const h0=a&&(a.horario||[])[di];
    const res=[];for(let w=0;w<weeks;w++)res.push(resolveDay(d,w));
    h+='<section class="p-day"><h2>'+esc(d.nombre||('Día '+(di+1)))+(h0&&h0.d!=null?' <span>· '+WDL[h0.d]+(h0.hora?' '+esc(h0.hora):'')+'</span>':'')+'</h2>';
    const info=[];if(d.objetivo)info.push('<b>Objetivo:</b> '+esc(d.objetivo));if(d.duracion)info.push('<b>Duración:</b> '+esc(d.duracion)+'′');if(d.rpe)info.push('<b>RPE:</b> '+esc(d.rpe));
    if(info.length)h+='<p class="p-info">'+info.join(' &nbsp;·&nbsp; ')+'</p>';
    if(d.calor)h+='<p class="p-info"><b>Entrada en calor:</b> '+esc(d.calor).replace(/\n/g,'<br>')+'</p>';
    const bl=(d.bloques||[]);
    if(bl.some(b=>(b.ejercicios||[]).some(e=>e.n))){
      const hasC=bl.some(b=>(b.ejercicios||[]).some(e=>e.n&&e.c));
      const nCols=2+(anyProg?weeks:1)+(hasC?1:0);
      h+='<table class="p-t"><thead><tr><th class="p-i"></th><th>Ejercicio</th>'+(anyProg?Array.from({length:weeks},(_,w)=>'<th class="p-w">Sem '+(w+1)+'</th>').join(''):'<th class="p-w">Series × reps</th>')+(hasC?'<th class="p-c">'+(anyProg?'Carga (sem 1)':'Carga')+'</th>':'')+'</tr></thead><tbody>';
      let L=0;
      bl.forEach((b,bi)=>{
        const ex=(b.ejercicios||[]).map((e,ei)=>({e,ei})).filter(x=>x.e.n);if(!ex.length)return;
        const letter=String.fromCharCode(65+L++);
        h+='<tr class="p-blk"><td colspan="'+nCols+'"><b>'+letter+' · '+esc(b.nombre||('Bloque '+(bi+1)))+'</b>'+(b.series?' — '+esc(b.series)+' series':'')+(b.nota?' — <i>'+esc(b.nota)+'</i>':'')+'</td></tr>';
        ex.forEach(({e,ei},k)=>{
          let prev='';
          const cells=res.map((rd,w)=>{
            const rb=rd.bloques[bi],re=rb.ejercicios[ei];
            const txt=presText(re,rb)||'—';const cg=re.c!==e.c&&re.c?' <small>'+esc(re.c)+'</small>':'';
            const chg=w>0&&txt+cg!==prev;prev=txt+cg;
            return '<td class="p-w'+(chg?' chg':'')+'">'+esc(txt)+cg+'</td>';
          }).join('');
          h+='<tr><td class="p-i">'+letter+(k+1)+'</td><td class="p-n">'+esc(e.n)+(e.obs?'<i class="p-ob">'+esc(e.obs)+'</i>':'')+'</td>'+cells+(hasC?'<td class="p-c">'+esc(e.c||'')+'</td>':'')+'</tr>';
        });
      });
      h+='</tbody></table>';
    }
    if(r.tipo==='cancha'){if(d.principal)h+='<p class="p-info"><b>Parte principal:</b> '+esc(d.principal).replace(/\n/g,'<br>')+'</p>';if(d.calma)h+='<p class="p-info"><b>Vuelta a la calma:</b> '+esc(d.calma).replace(/\n/g,'<br>')+'</p>';}
    if(d.notas)h+='<p class="p-info"><b>Notas:</b> '+esc(d.notas).replace(/\n/g,'<br>')+'</p>';
    h+='</section>';
  });
  if(anyProg)h+='<p class="p-foot">En negrita: lo que cambia respecto de la semana anterior.</p>';
  /* sin márgenes del navegador (ahí van fecha, título y link): el margen lo pone la tabla de abajo,
     cuyo encabezado y pie vacíos se repiten en cada hoja */
  const pa=$('#printArea');pa.innerHTML='<table class="p-wrap"><thead><tr><td><div class="p-sp"></div></td></tr></thead><tbody><tr><td>'+h+'</td></tr></tbody><tfoot><tr><td><div class="p-sp"></div></td></tr></tfoot></table>';
  document.body.classList.add('printing');
  const oldTitle=document.title;document.title=r.nombre||'Rutina';   /* nombre del PDF al guardar */
  const done=()=>{document.body.classList.remove('printing');pa.innerHTML='';document.title=oldTitle;window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  setTimeout(()=>{try{window.print();}catch(e){toast('No se pudo abrir la impresión en este navegador');done();}},80);
}

const rutById=id=>S.rutAll.find(r=>r.id===id)||null;
const asigOfCat=c=>S.asigAll.filter(a=>a.cat===c);
const catName=id=>(S.cats.find(c=>c.id===id)||{}).nombre||id;
function asigState(a){if(a.hasta&&a.hasta<TODAY)return 'fin';if(a.desde>TODAY)return 'prox';return 'vig';}

/* Pasa las rutinas viejas (guardadas dentro de una categoría) a la biblioteca + una asignación. Corre una vez. */
let migrated=false;
async function migrateRutinas(){
  if(migrated)return;migrated=true;
  try{
    const R=await Store.getAll('rutinas'),A=await Store.getAll('asignaciones');
    for(const id of Object.keys(R)){
      const r=R[id];if(!r.cat)continue;
      const ds=rutDays(r);
      if(!A['mig_'+id])await Store.put('asignaciones','mig_'+id,{cat:r.cat,rutina:id,desde:r.desde||TODAY,semanas:r.semanas==null?4:r.semanas,hasta:r.hasta||'',finalizada:!!r.finalizada,horario:ds.map(d=>({d:d.d==null?null:d.d,hora:d.hora||''}))});
      await Store.put('rutinas',id,{nombre:r.nombre||'Rutina',tipo:r.tipo||'gym',semanas:r.semanas||4,sesiones:ds.map(d=>{const c=Object.assign({},d);delete c.d;delete c.hora;return c;})});
    }
  }catch(e){console.warn('migración rutinas',e);}

/* ----- editor de la rutina (contenido) ----- */
function openRut(id,preset,after){
  const r0=id?rutById(id):null;
  let r=r0||preset||{nombre:'',tipo:'gym',semanas:4};
  const isNew=!r0;
  const dkey='rut-'+(id||(preset?'dup-'+slug(preset.nombre||''):'nueva'));
  const dr=Draft.get(dkey);
  if(dr)r=Object.assign({},r,{nombre:dr.nombre,tipo:dr.tipo,semanas:dr.semanas,sesiones:dr.days});
  let tipo=r.tipo||'gym';
  const days=JSON.parse(JSON.stringify(rutDays(r))).map(d=>{delete d.d;delete d.hora;return d;});
  if(!days.length)days.push({nombre:'Día 1'});
  let cur=dr&&dr.cur<days.length?dr.cur:0;
  const users=r0?S.asigAll.filter(a=>a.rutina===r0.id&&asigState(a)!=='fin').map(a=>catName(a.cat)):[];
  const b=(dr?draftNote(dr.t):'')+(users.length>1?'<div class="rut-note">La usan <b>'+users.map(esc).join(', ')+'</b>. Lo que cambies acá se aplica a todas. Si una categoría necesita algo distinto, usá <b>Duplicar</b> en la biblioteca.</div>':'')+
    '<div class="form-grid"><div class="field" style="grid-column:1/-1"><label for="r_n">Nombre de la rutina</label><input id="r_n" value="'+esc(r.nombre||'')+'" placeholder="Ej: Fuerza · Mesociclo 1"></div>'+
    '<div class="field"><label for="r_w">Duración del mesociclo</label><select id="r_w">'+[1,2,3,4,5,6,8,10,12].map(n=>'<option value="'+n+'"'+((r.semanas||4)==n?' selected':'')+'>'+n+(n===1?' semana':' semanas')+'</option>').join('')+'</select></div></div>'+
    '<div class="stype" id="r_tipo">'+['gym','cancha'].map(t=>'<button type="button" class="'+t+(t===tipo?' on':'')+'" data-rt="'+t+'"><span class="dot"></span>'+(t==='gym'?'Gym':'Cancha')+'</button>').join('')+'</div>'+
    '<div><h3>Días de entrenamiento</h3><div class="day-tabs" id="dayTabs"></div></div>'+
    '<div class="day-panel" id="dayPanel"></div>';
  const foot='<div class="modal-f">'+(isNew?'':'<button class="btn danger" id="r_del">Borrar rutina</button>')+'<button class="btn" id="r_print">Imprimir planilla</button><div class="grow"></div><button class="btn" data-close>Cancelar</button><button class="btn pri" id="r_save">'+(isNew?'Guardar y asignar':'Guardar rutina')+'</button></div>';
  openModal(modalHead('Biblioteca de rutinas',isNew?'Nueva rutina':r.nombre)+'<div class="modal-b">'+b+'</div>'+foot,mw=>{
    const q=id=>mw.querySelector('#'+id);
    const panel=q('dayPanel'),tabs=q('dayTabs');
    wireContent(panel);
    const saveCur=()=>{
      const d=days[cur];if(!d||!panel.querySelector('#d_n'))return;
      Object.assign(d,readContent(panel,tipo));
      d.nombre=panel.querySelector('#d_n').value.trim()||('Día '+(cur+1));
      if(tipo!=='cancha'){delete d.principal;delete d.calma;}
    };
    const drawTabs=()=>{
      tabs.innerHTML=days.map((d,i)=>'<button type="button" class="dtab'+(i===cur?' on':'')+'" data-dtab="'+i+'"><b>'+esc(d.nombre||('Día '+(i+1)))+'</b><small>'+((d.bloques||[]).reduce((t,b)=>t+(b.ejercicios||[]).length,0))+' ejercicios</small></button>').join('')+
        '<button type="button" class="dtab add" data-dadd>+ Agregar día</button>';
    };
    const drawPanel=()=>{
      const d=days[cur];
      panel.innerHTML='<div class="day-head"><div class="field"><label for="d_n">Nombre del día</label><input id="d_n" value="'+esc(d.nombre||'')+'" placeholder="Ej: Día 1 · Tren inferior"></div></div>'+
        contentHtml(d,tipo,{rutina:true,weeks:+q('r_w').value||4})+
        '<div class="day-foot"><button type="button" class="btn sm" id="d_copy">Duplicar este día</button>'+(days.length>1?'<button type="button" class="btn sm danger" id="d_rm">Quitar este día</button>':'')+'</div>';
      panel.querySelector('#d_n').oninput=()=>{saveCur();drawTabs();};
      panel.querySelector('#d_copy').onclick=()=>{saveCur();const c=JSON.parse(JSON.stringify(days[cur]));c.nombre='Día '+(days.length+1);days.push(c);cur=days.length-1;drawTabs();drawPanel();toast('Día duplicado');};
      const rm=panel.querySelector('#d_rm');if(rm)armDelete(rm,()=>{days.splice(cur,1);cur=Math.max(0,cur-1);drawTabs();drawPanel();});
    };
    tabs.addEventListener('click',e=>{
      const t=e.target.closest('[data-dtab],[data-dadd]');if(!t)return;
      saveCur();
      if(t.dataset.dadd!=null){days.push({nombre:'Día '+(days.length+1)});cur=days.length-1;}
      else cur=+t.dataset.dtab;
      drawTabs();drawPanel();tabs.scrollIntoView({block:'start',behavior:'smooth'});
    });
    drawTabs();drawPanel();
    q('r_w').onchange=()=>{saveCur();drawPanel();};
    /* borrador: se guarda solo mientras escribís */
    let dt;const autosave=()=>{clearTimeout(dt);dt=setTimeout(()=>{if(!q('r_n'))return;saveCur();Draft.set(dkey,{nombre:q('r_n').value,tipo,semanas:+q('r_w').value||4,days,cur});},400);};
    mw.addEventListener('input',autosave);mw.addEventListener('change',autosave);
    mw.addEventListener('click',e=>{if(e.target.closest('.modal-b button'))autosave();});
    mw.querySelectorAll('[data-close]').forEach(x=>x.addEventListener('click',()=>{clearTimeout(dt);Draft.del(dkey);}));
    if(q('dropDraft'))q('dropDraft').onclick=()=>{Draft.del(dkey);openRut(id,preset,after);};
    q('r_print').onclick=()=>{saveCur();printRutObj({nombre:q('r_n').value.trim(),tipo,semanas:+q('r_w').value||4,sesiones:days},null);};
    mw.querySelectorAll('[data-rt]').forEach(btn=>btn.onclick=()=>{tipo=btn.dataset.rt;mw.querySelectorAll('[data-rt]').forEach(x=>x.classList.toggle('on',x===btn));const c=panel.querySelector('.cancha-only');if(c)c.hidden=tipo!=='cancha';});
    if(q('r_del'))armDelete(q('r_del'),async()=>{
      for(const a of S.asigAll.filter(a=>a.rutina===r0.id))await Store.remove('asignaciones',a.id);
      clearTimeout(dt);Draft.del(dkey);await Store.remove('rutinas',r0.id);closeModal();toast('Rutina borrada de la biblioteca y de sus categorías');});
    q('r_save').onclick=async()=>{
      saveCur();
      const nombre=q('r_n').value.trim();if(!nombre){toast('Ponele un nombre a la rutina');return;}
      const newId=r0?r0.id:uid();
      const data={nombre,tipo,semanas:+q('r_w').value||4,sesiones:days};
      try{await Store.put('rutinas',newId,data);clearTimeout(dt);Draft.del(dkey);days.forEach(d=>saveToLibrary(d.bloques||[]));
        if(isNew){toast('Rutina guardada. Ahora elegí a qué categorías va.');setTimeout(()=>openAsig(null,{rutina:newId,cat:after&&after.cat,_rut:Object.assign({id:newId},data)}),60);}
        else{closeModal();toast('Rutina guardada');}
      }catch(e){}
    };
  });
}
function dupRut(id){
  const r=rutById(id);if(!r)return;
  openRut(null,{nombre:r.nombre+' (copia)',tipo:r.tipo,semanas:r.semanas,sesiones:JSON.parse(JSON.stringify(rutDays(r)))});
}

/* ----- asignar una rutina a categorías (días, horarios y fechas) ----- */
function openAsig(aid,preset){
  const a0=aid?S.asigAll.find(x=>x.id===aid):null;
  preset=preset||{};
  let rid=a0?a0.rutina:(preset.rutina||'');
  const getR=()=>rutById(rid)||(preset._rut&&preset._rut.id===rid?preset._rut:null);
  const r=getR();
  const a=a0||{desde:TODAY,semanas:r?(r.semanas||4):4,horario:[]};
  const cats=S.cats.slice().sort((x,y)=>(x.orden||0)-(y.orden||0));
  const pre=a0?[a0.cat]:(preset.cat?[preset.cat]:[]);
  let b='';
  if(!a0)b+='<div class="field"><label for="a_r">Rutina</label><select id="a_r"><option value="">Elegí una rutina…</option>'+S.rutAll.concat(preset._rut&&!rutById(preset._rut.id)?[preset._rut]:[]).slice().sort((x,y)=>(x.nombre||'').localeCompare(y.nombre||'','es')).map(x=>'<option value="'+esc(x.id)+'"'+(x.id===rid?' selected':'')+'>'+esc(x.nombre)+'</option>').join('')+'</select></div>';
  b+=a0?'<div class="rut-note">Categoría: <b>'+esc(catName(a0.cat))+'</b> · Rutina: <b>'+esc(r?r.nombre:'(borrada)')+'</b></div>'
    :'<div class="field"><label>Categorías</label><div class="cat-picks">'+cats.map(c=>'<label class="cat-pick'+(pre.includes(c.id)?' on':'')+'"><input type="checkbox" value="'+esc(c.id)+'"'+(pre.includes(c.id)?' checked':'')+'>'+esc(c.nombre)+'</label>').join('')+'</div><span class="tiny">Podés elegir varias: todas quedan con los mismos días y horarios (después podés cambiarle el horario a una sola).</span></div>';
  b+='<div class="form-grid"><div class="field"><label for="a_d">Empieza</label><input type="date" id="a_d" value="'+esc(a.desde||TODAY)+'"></div>'+
    '<div class="field"><label for="a_w">Duración</label><select id="a_w">'+[1,2,3,4,5,6,8,10,12].map(n=>'<option value="'+n+'"'+(a.semanas==n?' selected':'')+'>'+n+(n===1?' semana':' semanas')+'</option>').join('')+'<option value="0"'+(a.semanas===0?' selected':'')+'>Hasta nuevo aviso</option></select></div>'+
    '<div class="field" style="grid-column:1/-1"><span class="tiny" id="a_end"></span></div></div>'+
    '<div><h3>Días y horarios</h3><div id="a_sched"></div></div>';
  const foot='<div class="modal-f">'+(a0?'<button class="btn danger" id="a_del">Quitar de la categoría</button>':'')+'<div class="grow"></div><button class="btn" data-close>Cancelar</button><button class="btn pri" id="a_save">'+(a0?'Guardar':'Asignar')+'</button></div>';
  openModal(modalHead('Asignar rutina',a0?'Días y fechas':(r?r.nombre:'Asignar rutina'))+'<div class="modal-b">'+b+'</div>'+foot,mw=>{
    const q=id=>mw.querySelector('#'+id);
    const drawSched=()=>{
      const rr=getR();const box=q('a_sched');
      if(!rr){box.innerHTML='<p class="muted">Elegí una rutina para ver sus días.</p>';return;}
      const ds=rutDays(rr);
      box.innerHTML='<div class="sched">'+ds.map((d,i)=>{const h=(a.horario||[])[i]||{};
        return '<div class="sched-row" data-i="'+i+'"><div class="sched-n"><b>'+esc(d.nombre||('Día '+(i+1)))+'</b></div><div class="wd-pick">'+WD.map((w,k)=>'<button type="button" class="wdb'+(h.d===k?' on':'')+'" data-k="'+k+'">'+w+'</button>').join('')+'</div><input type="time" class="sched-h" aria-label="Horario de '+esc(d.nombre||'')+'" value="'+esc(h.hora||'')+'"></div>';}).join('')+'</div>';
    };
    const readSched=()=>[...mw.querySelectorAll('.sched-row')].map(row=>{const on=row.querySelector('.wdb.on');return {d:on?+on.dataset.k:null,hora:row.querySelector('.sched-h').value};});
    drawSched();
    mw.addEventListener('click',e=>{
      const wb=e.target.closest('.sched-row .wdb');if(wb){const on=wb.classList.contains('on');wb.parentElement.querySelectorAll('.wdb').forEach(x=>x.classList.remove('on'));if(!on)wb.classList.add('on');return;}
    });
    mw.querySelectorAll('.cat-pick input').forEach(cb=>cb.onchange=()=>cb.parentElement.classList.toggle('on',cb.checked));
    if(q('a_r'))q('a_r').onchange=()=>{a.horario=readSched();rid=q('a_r').value;const rr=getR();if(rr&&!a0){q('a_w').value=String(rr.semanas||4);endTxt();}drawSched();};
    const endTxt=()=>{const w=+q('a_w').value,d=q('a_d').value;q('a_end').textContent=!d?'':w?'Termina el '+fmtD(addDays(d,w*7-1),{weekday:'long',day:'numeric',month:'long'})+'.':'Queda vigente hasta que la finalices.';};
    q('a_w').onchange=endTxt;q('a_d').onchange=endTxt;endTxt();
    if(q('a_del'))armDelete(q('a_del'),async()=>{await Store.remove('asignaciones',a0.id);closeModal();toast('Rutina quitada de '+catName(a0.cat));});
    q('a_save').onclick=async()=>{
      const rr=getR();if(!rr){toast('Elegí una rutina');return;}
      const targets=a0?[a0.cat]:[...mw.querySelectorAll('.cat-pick input:checked')].map(i=>i.value);
      if(!targets.length){toast('Elegí al menos una categoría');return;}
      const horario=readSched();
      const sin=horario.findIndex(h=>h.d==null);
      if(sin>=0){toast('Elegí el día de la semana de '+(rutDays(rr)[sin].nombre||'Día '+(sin+1)));return;}
      const seen={};if(horario.some(h=>{if(seen[h.d])return true;seen[h.d]=1;return false;})){toast('Dos días de la rutina caen el mismo día de la semana. Cambiá uno.');return;}
      const desde=q('a_d').value;if(!desde){toast('Elegí la fecha de inicio');return;}
      const semanas=+q('a_w').value;
      const keepEnd=a0&&a0.finalizada&&a0.hasta;
      for(const c of targets){
        const data={cat:c,rutina:rr.id,desde,semanas,hasta:keepEnd?a0.hasta:(semanas?addDays(desde,semanas*7-1):''),finalizada:!!keepEnd,horario};
        await Store.put('asignaciones',a0?a0.id:uid(),data);
      }
      closeModal();toast(a0?'Guardado':'Asignada a '+targets.map(catName).join(', '));
    };
  });
}

function queueAtt(marcas){

/* ================= testeos ================= */
/* lista de testeos = los que vienen de fábrica + los que agregaste − los que quitaste */
function allExercises(withHidden){
  const m={};EXERCISES.forEach((e,i)=>m[e.k]=Object.assign({o:i},e));
  S.tes.forEach(t=>{if(!m[t.ejercicio])m[t.ejercicio]={k:t.ejercicio,n:t.nombre||t.ejercicio,u:t.unidad||'',low:!!t.menorMejor,o:500};});
  S.testList.forEach(d=>{m[d.id]=Object.assign({o:m[d.id]?m[d.id].o:1000},m[d.id]||{},{k:d.id},d.n?{n:d.n,u:d.u||'',low:!!d.low}:{},{hid:!!d.oculto});});
  const arr=Object.values(m).sort((a,b)=>a.o-b.o);
  return withHidden?arr:arr.filter(e=>!e.hid);
}

    '<div class="field" style="grid-column:1/-1"><label for="tl_n">Nombre</label><input id="tl_n" placeholder="Ej: Press militar, Remo, Salto horizontal"></div>'+
    '<div class="field"><label for="tl_u">Unidad</label><select id="tl_u"><option>kg</option><option>cm</option><option>s</option><option>m</option><option>reps</option><option>m/s</option><option>N</option><option value="">Sin unidad</option></select></div>'+
    '<label class="check" style="align-self:end"><input type="checkbox" id="tl_low"> Menos es mejor (tiempos)</label></div>'+
    '<button class="btn pri" type="submit" style="margin-top:10px">Agregar</button><p class="tiny" style="margin:8px 0 0">Con unidad kg vas a poder cargar kg × reps (RM indirecto) y usar %RM en las sesiones.</p></form>'+
    '<div id="tlBody">'+draw()+'</div><p class="tiny" style="margin:0">Quitar un ejercicio lo saca de la lista, pero los registros que ya tenga no se borran: si lo volvés a mostrar, aparecen de nuevo.</p>';
  openModal(modalHead('Testeos','Ejercicios a testear')+'<div class="modal-b">'+b+'</div><div class="modal-f"><div class="grow"></div><button class="btn pri" data-close>Listo</button></div>',mw=>{

    mw.querySelector('#tlForm').addEventListener('submit',e=>{
      e.preventDefault();const n=mw.querySelector('#tl_n').value.trim();if(!n){toast('Poné el nombre del ejercicio');return;}

const fmtN=v=>{const n=Number(v);return isNaN(n)?String(v):n.toLocaleString('es-AR',{maximumFractionDigits:2});};
function spark(vals,low){
  if(vals.length<2)return '<span class="tiny">–</span>';
  const w=80,hh=22,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[2+i*(w-4)/(vals.length-1),hh-3-((v-mn)/r)*(hh-6)]);
  const up=low?vals[vals.length-1]<=vals[0]:vals[vals.length-1]>=vals[0];
  const c=up?'var(--good)':'var(--bad)';const l=pts[pts.length-1];
  return '<svg class="spark" width="'+w+'" height="'+hh+'" viewBox="0 0 '+w+' '+hh+'" aria-hidden="true"><polyline fill="none" stroke="'+c+'" stroke-width="1.6" stroke-linejoin="round" points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/><circle cx="'+l[0].toFixed(1)+'" cy="'+l[1].toFixed(1)+'" r="2.6" fill="'+c+'"/></svg>';
}
/* ---------- RM indirecto ---------- */
const RM_F={
  epley:{n:'Epley',f:(w,r)=>w*(1+r/30)},
  brzycki:{n:'Brzycki',f:(w,r)=>r>=37?null:w*36/(37-r)},
  lombardi:{n:'Lombardi',f:(w,r)=>w*Math.pow(r,0.10)}
};
function rmEst(w,r,f){if(!(w>0))return null;if(!(r>1))return w;const x=(RM_F[f]||RM_F.epley).f(w,r);return x==null?null:Math.round(x*10)/10;}

/* ---------- ideales de testeo ---------- */
const catRama=c=>{c=c||S.cats.find(x=>x.id===S.cat)||{};return c.rama||(/fem/i.test(c.nombre||'')?'f':'m');};
function idealOf(k){
  const d=S.ideales.find(x=>x.id===k);if(!d)return null;
  const r=catRama();const v=r==='f'?(d.f??d.m):(d.m??d.f);
  if(v==null||v==='')return null;
  return {tipo:d.tipo||'abs',v:Number(v),doc:d};
}
function idealLabel(id,ex){
  if(!id)return '';
  return id.tipo==='rel'?fmtN(id.v)+'× peso corporal':(ex.low?'≤ ':'')+fmtN(id.v)+' '+(ex.u||'');
}
/* valor + peso corporal → cuán cerca del ideal */
function evalIdeal(val,bw,ex,id){
  if(val==null||!id)return null;
  if(id.tipo==='rel'){
    if(!bw)return {nobw:true};
    const target=id.v*bw;return {target,pct:val/target,falta:Math.max(0,target-val),rel:val/bw};
  }
  if(ex.low)return {target:id.v,pct:val>0?id.v/val:0,falta:Math.max(0,val-id.v)};
  return {target:id.v,pct:val/id.v,falta:Math.max(0,id.v-val)};
}
const pctCls=p=>p>=1?'good':p>=.8?'warn':'bad';
function bwOf(jid,t){const s=t&&t.pc&&t.pc[jid];if(s)return Number(s);const j=S.jug.find(x=>x.id===jid);return j&&j.peso?Number(j.peso):null;}

function vTests(){

  const cols=tests.slice(-6);

  h+='<div class="tbl-wrap"><table class="t-main"><thead><tr><th>Jugador</th><th>Fecha</th>'+
    (kg?'<th class="r">Levantó</th><th class="r">1RM</th><th class="r">Peso corp.</th><th class="r">1RM / peso corp.</th>':'<th class="r">Marca</th>')+
    (id?'<th class="r">Ideal</th><th>Cumplimiento</th><th class="r">Falta</th>':'')+'</tr></thead><tbody>';
  rows.forEach(({j,last,ev})=>{
    if(!last){h+='<tr><td class="c-name">'+esc(j.nombre)+'</td><td colspan="'+(1+(kg?4:1)+(id?3:0))+'"><span class="tiny">Sin registros</span></td></tr>';return;}
    h+='<tr><td class="c-name">'+esc(j.nombre)+'</td><td class="tiny c-date">'+esc(fmtD(last.t.fecha,{day:'numeric',month:'short'}))+'</td>';

        '<td class="r mono" data-l="Peso corp.">'+(last.bw?fmtN(last.bw)+' kg':'<button class="linkish tiny" data-editj="'+esc(j.id)+'">cargar</button>')+'</td>'+
        '<td class="r mono" data-l="1RM / peso corp.">'+(last.ratio!=null?'<b class="ratio">'+last.ratio.toFixed(2)+'×</b>':'–')+'</td>';
    } else h+='<td class="r mono" data-l="Marca"><b>'+esc(fmtN(last.v))+'</b> '+esc(ex.u)+'</td>';
    if(id){
      if(!ev||ev.nobw)h+='<td class="r mono" data-l="Ideal">'+(rel?fmtN(id.v)+'×':'–')+'</td><td data-l="Cumplimiento"><span class="tiny">'+(ev&&ev.nobw?'falta peso corporal':'sin datos')+'</span></td><td class="r" data-l="Falta">–</td>';
      else{const p=Math.round(ev.pct*100),cls=pctCls(ev.pct);
        h+='<td class="r mono" data-l="Ideal">'+(rel?fmtN(id.v)+'× = ':'')+fmtN(Math.round(ev.target*10)/10)+' '+esc(ex.u)+'</td>'+
          '<td data-l="Cumplimiento"><span class="bar-pct"><i style="width:'+Math.min(p,100)+'%;background:var(--'+cls+')"></i></span><span class="pill '+cls+'">'+(p>=100?'✓ ':'')+p+'%</span></td>'+
          '<td class="r mono" data-l="Falta">'+(ev.falta>0?(ex.low?'−':'+')+fmtN(Math.round(ev.falta*100)/100)+' '+esc(ex.u):'<span class="delta-up">Alcanzado</span>')+'</td>';}
    }
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  if(kg)h+='<p class="tiny" style="margin-top:6px">1RM con ≈ = estimado a partir de kg × reps ('+esc((RM_F[(cols[cols.length-1]||{}).formula]||RM_F.epley).n)+'). 1RM / peso corp. = cuántas veces su peso corporal puede levantar.'+(id?' Verde ≥ 100 % del ideal · amarillo 80–99 % · rojo &lt; 80 %.':'')+'</p>';

function parseMin(v){v=String(v??'').trim();if(!v)return null;const m=v.match(/^(\d{1,3}):(\d{1,2})$/);if(m)return +m[1]+(+m[2])/60;const n=Number(v.replace(',','.'));return isNaN(n)?null:n;}
const fmtMin=m=>{if(m==null)return '–';let mm=Math.floor(m),ss=Math.round((m-mm)*60);if(ss===60){mm++;ss=0;}return ss?mm+':'+String(ss).padStart(2,'0'):String(mm);};
